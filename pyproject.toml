[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "snakegame"
version = "2.0.0"
description = "Game Snake modern dengan pygame-ce: mode permainan, combo, leaderboard, efek partikel, dan dukungan web."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Delfi Fikri Mukarom" }]
dependencies = ["pygame-ce>=2.5"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
web = ["pygbag==0.9.3"]

[project.scripts]
snakegame = "snakegame.app:main"

[tool.setuptools]
packages = ["snakegame"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore:no fast renderer available"]
